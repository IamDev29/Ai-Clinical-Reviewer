services:
  # -------------------------------------------------------------
  # Backend FastAPI Service (Render Web Service)
  # -------------------------------------------------------------
  - type: web
    name: ai-clinical-reviewer-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: PROJECT_NAME
        value: "AI Clinical Document Reviewer"
      - key: API_V1_STR
        value: "/api/v1"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: clinical-reviewer-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://ai-clinical-reviewer.vercel.app","http://localhost:5173","http://localhost:3000"]'
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: RUN_MIGRATIONS
        value: "true"

  # -------------------------------------------------------------
  # Frontend Static SPA Service (Render Static Site)
  # -------------------------------------------------------------
  - type: web
    name: ai-clinical-reviewer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-clinical-reviewer-backend
          property: host
          valueTransformer: "https://${host}/api/v1"

# -------------------------------------------------------------
# Managed PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: clinical-reviewer-db
    databaseName: clinical_reviewer
    user: postgres
    plan: free
